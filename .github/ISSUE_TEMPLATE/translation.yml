name: Translation improvement
description: Fix or improve a UI translation
title: "[i18n] "
labels: ["translation"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - 简体中文
        - 日本語
        - 한국어
        - Русский
        - New language
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
      description: Paste the current string and where it appears.
      placeholder: |
        Screen: Settings → Language
        Current: ...
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context or screenshot
      description: A screenshot helps, but remove personal data first.
  - type: checkboxes
    id: confirm
    attributes:
      label: Checklist
      options:
        - label: I kept placeholders such as %s and %1$d unchanged.
          required: true
        - label: I did not include personal data.
          required: true
