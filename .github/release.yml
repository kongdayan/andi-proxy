changelog:
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Translations
      labels:
        - translation
        - i18n
    - title: Documentation
      labels:
        - documentation
    - title: Build and release
      labels:
        - build
        - release
        - dependencies
    - title: Other changes
      labels:
        - "*"
