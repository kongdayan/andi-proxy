name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set on this runner"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
              "$ANDROID_HOME/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache pinned binaries
        uses: actions/cache@v6
        with:
          path: .tools/downloads
          key: ${{ runner.os }}-andi-cores-1.14.2-2.18.0

      - name: Fetch pinned proxy cores
        run: python3 scripts/fetch-core.py

      - name: Validate translations
        run: python3 scripts/check-i18n.py

      - name: Unit tests, lint and debug APKs
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: andi-proxy-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: andi-proxy-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
