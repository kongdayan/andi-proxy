name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix (for example 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi
          CODE="$(python3 - "$VERSION" <<'PY'
          import re, sys
          m = re.match(r'(\d+)\.(\d+)\.(\d+)', sys.argv[1])
          print(int(m.group(1)) * 10000 + int(m.group(2)) * 100 + int(m.group(3)))
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building Andi Proxy $VERSION ($CODE)"

      - name: Decode release keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/andi-release.jks"
            echo "ANDI_KEYSTORE=$RUNNER_TEMP/andi-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Using the configured release keystore."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; the APKs will be debug-signed."
          fi

      - name: Cache pinned binaries
        uses: actions/cache@v4
        with:
          path: .tools/downloads
          key: ${{ runner.os }}-andi-cores-1.14.2-2.18.0

      - name: Fetch pinned proxy cores
        run: python3 scripts/fetch-core.py

      - name: Validate translations
        run: python3 scripts/check-i18n.py

      - name: Build release APKs
        env:
          ANDI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Collect, verify and checksum APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk" .apk)"
            abi="${base#app-}"
            abi="${abi%-release}"
            if [ "$abi" = "release" ] || [ -z "$abi" ]; then abi="universal"; fi
            out="dist/AndiProxy-${abi}.apk"
            cp "$apk" "$out"
            echo "--- $out"
            "$APKSIGNER" verify --print-certs "$out"
            "$AAPT" dump badging "$out" | grep -E '^(package|native-code)' || true
            if [ "$abi" != "universal" ]; then
              unzip -l "$out" | grep -q "lib/${abi}/libsingbox.so" || { echo "::error::$out is missing libsingbox.so for $abi"; exit 1; }
              unzip -l "$out" | grep -q "lib/${abi}/libhev-socks5-tunnel.so" || { echo "::error::$out is missing hev-socks5-tunnel for $abi"; exit 1; }
            fi
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Write build provenance note
        shell: bash
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            echo "Signed with the Andi Proxy release key." > dist/SIGNING.txt
          else
            echo "Debug-signed build. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets to sign releases with a stable key." > dist/SIGNING.txt
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: andi-proxy-${{ steps.version.outputs.version }}-apks
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS dist/SIGNING.txt \
            --title "Andi Proxy ${TAG#v}" \
            --generate-notes \
            --verify-tag
