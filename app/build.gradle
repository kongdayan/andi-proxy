plugins { id 'com.android.application' }

def releaseVersionName = (project.findProperty('versionName') ?: '1.0.1').toString()
def releaseVersionCode = (project.findProperty('versionCode') ?: '10001').toString().toInteger()
def signingStore = System.getenv('ANDI_KEYSTORE') ?: project.findProperty('andi.keystore')
def signingStorePassword = System.getenv('ANDI_KEYSTORE_PASSWORD') ?: project.findProperty('andi.keystorePassword')
def signingKeyAlias = System.getenv('ANDI_KEY_ALIAS') ?: project.findProperty('andi.keyAlias')
def signingKeyPassword = System.getenv('ANDI_KEY_PASSWORD') ?: project.findProperty('andi.keyPassword')
def hasSigningKey = signingStore != null && !signingStore.toString().trim().isEmpty()

android {
    namespace 'com.andi.proxy'
    compileSdk 36

    defaultConfig {
        applicationId 'com.andi.proxy'
        minSdk 26
        targetSdk 35
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner project.findProperty('deviceRunner') ?: 'com.andi.proxy.DeviceSmokeRunner'
        buildConfigField 'String', 'PROJECT_URL', '"https://github.com/kongdayan/andi-proxy"'
    }

    signingConfigs {
        release {
            if (hasSigningKey) {
                storeFile file(signingStore)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // A public release can still be built without secrets; CI injects a stable key.
            signingConfig hasSigningKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures { buildConfig true }

    // One APK per ABI plus a universal APK. Devices only download what they can run.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
            universalApk true
        }
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libsingbox.so'] } }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
